name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Android 真机访问的 API 基址，需包含 /api
        required: false
        type: string
  push:
    branches:
      - main
      - master
      - code-to-app
    paths:
      - '.github/workflows/android-apk.yml'
      - 'frontend/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.ANDROID_API_BASE_URL }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Android API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ANDROID_API_BASE_URL 未配置。请在 GitHub Actions 手动输入 api_base_url，或在仓库 Variables 中设置 ANDROID_API_BASE_URL。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run cap:sync

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-canvas-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
