name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Android 真机访问的 API 基址，需包含 /api
        required: false
        type: string
      version_name:
        description: 版本名，例如 1.1
        required: false
        type: string
      version_code:
        description: 版本号（必须是递增的整数），例如 2
        required: false
        type: string
  push:
    branches:
      - main
      - master
      - code-to-app
    paths:
      - '.github/workflows/android-apk.yml'
      - 'frontend/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.ANDROID_API_BASE_URL }}
      APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PATH: ../daily-canvas-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Android API base URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ANDROID_API_BASE_URL 未配置。请在 GitHub Actions 手动输入 api_base_url，或在仓库 Variables 中设置 ANDROID_API_BASE_URL。"
            exit 1
          fi

      - name: Validate version code
        run: |
          if ! [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$APP_VERSION_CODE" -le 0 ]; then
            echo "version_code 必须是正整数，当前值：$APP_VERSION_CODE"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Android project
        run: npm run cap:sync

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/daily-canvas-release.jks
          ls -l android/daily-canvas-release.jks

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE"
        working-directory: frontend/android

      - name: Build debug APK without signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次构建 debug 包。debug 包签名每次不同，无法覆盖安装已安装的正式包。"
          ./gradlew assembleDebug -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE"
        working-directory: frontend/android

      - name: Compute package checksum
        id: package_info
        run: |
          APK_PATH="$(ls -1 android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "未找到构建产物"
            exit 1
          fi

          SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          SIZE="$(wc -c < "$APK_PATH" | tr -d ' ')"
          FILE_NAME="daily-canvas-${APP_VERSION_NAME}.apk"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Android 构建结果

          - 版本：${APP_VERSION_NAME} (${APP_VERSION_CODE})
          - 产物：${APK_PATH}
          - 大小：${SIZE} 字节
          - SHA-256：${SHA256}

          ### 版本清单（发布到 deploy/downloads/app-release.json）

          \`\`\`json
          {
            "versionName": "${APP_VERSION_NAME}",
            "versionCode": ${APP_VERSION_CODE},
            "releaseNotes": ["在这里填写本次更新说明"],
            "apkPath": "/downloads/${FILE_NAME}",
            "sha256": "${SHA256}",
            "size": ${SIZE}
          }
          \`\`\`
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-canvas-${{ env.APP_VERSION_NAME }}-apk
          path: ${{ steps.package_info.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
